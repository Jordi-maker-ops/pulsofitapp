name: iOS release (TestFlight)

# Archives, signs and uploads to TestFlight using an App Store Connect API key
# (cloud signing — no manual certificates/profiles). Triggers on version tags.
#
# The only SECRET you need to set is APPSTORE_API_KEY_BASE64 (base64 of your
# AuthKey_XXXX.p8). The Key ID / Issuer ID / Team ID below are identifiers, not
# secrets (useless without the private key), so they live here in plain text.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APPSTORE_API_KEY_ID: YHG77G22ZX
  APPSTORE_API_ISSUER_ID: f140f12a-bc34-40a3-862a-e239494d5c83
  APPLE_TEAM_ID: 7PFX3TDBT7

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Verify API key secret is set
        env:
          B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::error::Secret APPSTORE_API_KEY_BASE64 is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "APPSTORE_API_KEY_BASE64: set (len ${#B64})"

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_BASE64 }}" | base64 -d \
            > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Write ExportOptions.plist
        working-directory: app/ios/App
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict></plist>
          EOF

      - name: List schemes (diagnostic)
        working-directory: app/ios/App
        run: xcodebuild -list -project App.xcodeproj

      - name: Archive
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              echo "::error::Archive failed. Key error lines below:"
              grep -niE "error:|provisioning|certificate|signing|development team|no account|agreement|unable to|bundle identifier|failed to" "$RUNNER_TEMP/archive.log" | tail -60
              exit 65
            }

      # destination=upload makes -exportArchive sign AND upload in one step.
      - name: Export & upload to TestFlight
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
              echo "::error::Export/upload failed. Key error lines below:"
              grep -niE "error:|provisioning|certificate|signing|agreement|unable to|bundle identifier|failed to|asset validation|app record" "$RUNNER_TEMP/export.log" | tail -60
              exit 65
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulsofit-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
