name: Android build

# Builds the Android debug APK on a Linux runner (Google's Android SDK is
# available on GitHub runners) and uploads it as a downloadable artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pulsofit-android-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # To produce a signed release APK/AAB for the Play Store, add your keystore +
  # passwords as repository secrets and a signingConfig in android/app/build.gradle,
  # then run `./gradlew bundleRelease`. Left out here because it needs your keys.
